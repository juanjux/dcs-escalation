# Command centres. isCommandCenterUsable() is coalition-wide: while one of a side's
# centres is standing its SAMs stay cued and dark and its EWRs stay live; when the last
# one goes, every SAM of that coalition goes autonomous with its radar permanently on and
# every EWR goes dark. None of these were keys, so Skynet was never told they existed and
# the whole layer did nothing. Listing them as values (which the SAM entries already do)
# only draws the map link -- initializeIADSElement reads ConnectionNode, PowerSource and
# PD, never CommandCenter.
