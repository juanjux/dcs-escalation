name: Syria - Invasion of the Canary Islands 2030
theater: Syria
authors: NoGoodNews, modified by juanjux
description:
  <p>Fictional Campaign where Morocco is attacking Spain through Ceuta, Melilla and Canary Islands in 2030. This is a variation of the 
  "Invation of Canary Islands" campaign where Morocco is stronger for better balance and uses more modern planes like the Eurofighter, JF-17 or F-35.</p>
  <p>Many old aircrafts have been removed from both sides (F-5, Mirages, Gazelles, et cetera) and replaced by modern planes or choppers.</p>
  <p>Spain will mostly use Eurofighter Squadrons as already have or planned to have by 2030, so you need that mod. It also have one squadron of F/A-18C since Eurofighters can't totally replace it in game (e.g. no standoff bombs) and many players fly the F/A-18C</p>
  <p>The Harrier probably should be replaced by the F-35B but DCS' IA is pretty bugged when flying the AG version, so the Harriers have been kept.</p>
  <p>Morocco now have several planes that are rumored to be in the talks of adquiring like the F-35A (only AA version, see above) and the JF-17, while keeping some F-16CM that many players will fly.</p>
  <p>Both sides have now access to AWACS, JTAC (drone) and refuelers.</p>
  <p>Both sides also have semi-realistic navies (from light frigate up, corvette and patrollers are not included). In this case, the Spanish navy is stronger which balances Morocco's F-35 and the need of the Spanish faction to capture a lot more control points to win.</p>
  <p>SAM and AAA defenses have been reduced a lot, mostly removing duplicate defenses, which improves the campaign rythm removing some DEAD grind and also improves the performance.</p>
  <p>Using DCS' Syria map as the terrain, it results in a close representation of the terrain around Morocco and
  south of Spain, mainly due to the similar distances between Canary Islands (Cyprus) and Morocco Mainland (Syria, Lebanon).</p>
  <p>Morocco Armed Forces have landed in Tenerife (Akrotiri) and are trying to extend towards Tenerife Norte (Larnaca),
  Gando (Paphos) and eventually to Gran Canaria Norte (FOB).</p>
  <p>To put more pressure and distress onto the Spanish Government, they have also started attacks to take over the
  cities of Ceuta (FOB in Iskenderun) and Melilla (Bassel Al-Assad).</p>
  <p>You must support ground troops while reinforcements arrive to Canarias, as there are no armament production
  centers there. Ships will be sent from Rota Naval Base (Mersin) and Getafe Air Base (Adana Sakirpasa).
  Morocco will also try to support their expeditionary forces by sending reinforcements by sea.</p>
  <p>Prioritize naval targets!</p>
  <p>L-61 "Juan Carlos I" naval assault group has also been sent to the zone to support operations. F-18 Hornets from 
  Torrejon (Incirlik), Albacete and Gando will be your main assets. Additionally you can also use Mirage F-1s,
  F-5s or Harriers from the "Juan Carlos I".</p>
  <p>Very complex IADS network on each side.</p>
  <p>Recommended mods/plugins to use:<ul>
  <li>Spain Naval Assets Pack (it's a must)</li>
  <li>Eurofighter by Lechuzas Negras (it's a must)</li>
  <li>Frenchpack</li><li>High Digit SAMs</li>
  <li>Skynet IADS and CTLD are also highly recommended.</li>
  </ul></p>
