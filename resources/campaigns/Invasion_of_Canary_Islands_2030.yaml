    - Blue LHA Galicia
    - F102 Almirante Juan de Borbon

# Pins the composition of a naval group to its marker. Without this every fleet is
# whatever the faction happens to roll per marker, so "the heavy one" and "the patrol
# boats" cannot be told apart.
# GPS jamming: one site on the enemy EWR marker whose 15 nm radius covers the
# most of its own air defences. No radar on it, so it is a STRIKE target, not
# SEAD, and a satellite-guided weapon aimed inside the bubble lands wide.
