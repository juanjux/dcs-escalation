name: Afghanistan - Clash of the Titans
theater: Afghanistan
authors: Starfire, modified by juanjux
recommended_player_faction: USA 2020
recommended_enemy_faction: Redfor (Russia) 2020
description:
  <p><strong>This campaign utilises both Afghanistan East and West. It is intended to be run with CurrentHill's USA, Russia, and 
  China Asset Packs installed, although this is not mandatory.</strong></p>
  <p>F-22A, Super Hornet and Su-57 mods are optional; stock aircraft are used as fallbacks when disabled.</p>
  <p>In the rugged heart of Afghanistan, the balance of power is tipping. Clash of the Titans is a high-stakes campaign set during 
  a fictional escalation in 2020, where US-led BLUFOR forces face off against a resurgent and well-equipped REDFOR coalition.
  BLUFOR holds the vital eastern corridor, anchored by the fortified positions at Bagram Airfield, the strategic capital of Kabul, 
  and the forward base at Sharana. A recent offensive has resulted in REDFOR now controlling the southern and western strongholds of 
  Kandahar, Camp Bastion, and Tarinkot, each heavily fortified. Air superiority is hotly contested, and both
  sides are committing rotary and fixed-wing assets to interdiction, close air support, and deep strike missions. This is no border 
  skirmish. This is a theatre-wide confrontation where every flight counts and every decision could tilt the balance. Welcome to 
  Clash of the Titans. The skies over Afghanistan have never been more dangerous.</p>
  <p>Both sides have sector-based IADS with alternate command centres, redundant communications and power,
  and separate GPS jamming sites. Vehicle depots hold strikeable reserves at every base, including the neutral FOBs.
  Capture territory and attack the infrastructure to weaken the opposing network.</p>
  <p>The main ground axis runs from Bagram through Kabul, Ghazni and Lagman to Kandahar Heliport and Camp Bastion.
  A factory at Camp Bastion supplies the southern axis. Disconnected bases and neutral FOBs remain air-assault objectives.</p>
  <p>Both sides field early warning, tankers, airlift, dedicated air-assault helicopters and AFAC drones.
  Enable Realistic CAS and its AFAC option to use the MQ-9 and Wing Loong reconnaissance squadrons.</p>
  <p>Aircraft are dispersed across compatible airfields, with separate detachments for critical support and stealth assets.
  Losing one runway does not ground half the initial fleet or remove all early-warning, tanker or AFAC coverage.</p>
miz: clash_of_the_titans.miz
performance: 1
recommended_start_date: 2020-01-27
version: "10.9"
